{% extends 'applications/base.html' %}
{% block content %}

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Зберегти</button>
    </form>
    <a href="{% url 'profile' %}" class="btn-secondary">Назад</a>
</div>
{% endblock %}
